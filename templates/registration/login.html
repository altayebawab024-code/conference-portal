<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - بوابة المؤتمرات العلمية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .login-card { max-width: 450px; border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card login-card p-4 p-md-5 w-100 bg-white">
        <div class="text-center mb-4">
            <div class="avatar bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-2" style="width: 65px; height: 65px;">
                <i class="bi bi-mortarboard-fill fs-2 text-warning"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">جامعة البطانة</h4>
            <p class="text-muted small">دخول مدير المنصة ولجان التحكيم العلمي</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small text-center">
                اسم المستخدم أو كلمة المرور غير صحيحة!
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">اسم المستخدم</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control" required placeholder="manager أو scientific">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-6 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> تسجيل الدخول
            </button>
        </form>

        <div class="text-center border-top pt-3">
            <a href="{% url 'home' %}" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-right"></i> العودة للصفحة الرئيسية للمؤتمر
            </a>
        </div>
    </div>

</body>
</html>
